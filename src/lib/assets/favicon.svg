<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Home inventory favicon</title>
  <desc id="desc">A house inside a storage box with a green checkmark.</desc>

  <!-- Transparent background -->

  <!-- Box back -->
  <path d="M8 29 32 20l24 9-24 10Z" fill="#9A4F16"/>

  <!-- House -->
  <path d="M18 28 32 16l14 12v16H18Z" fill="#F8FAFC" stroke="#0F4C9A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M15 29 32 14l17 15" fill="none" stroke="#0B5ED7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="29" y="31" width="6" height="13" rx="1" fill="#7A3E12"/>
  <rect x="21" y="30" width="6" height="6" rx="1" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>

  <!-- Box front -->
  <path d="M8 33 32 41l24-8v20L32 61 8 53Z" fill="#D97A1C" stroke="#9A4F16" stroke-width="2" stroke-linejoin="round"/>
  <path d="M8 33 3 27l20 6 9 8-8 9Z" fill="#F4A13A" stroke="#C66A14" stroke-width="2" stroke-linejoin="round"/>
  <path d="m56 33 5-6-20 6-9 8 8 9Z" fill="#F4A13A" stroke="#C66A14" stroke-width="2" stroke-linejoin="round"/>

  <!-- Check badge -->
  <circle cx="48" cy="47" r="11" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
  <path d="m42.5 47 3.5 3.5 7-8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
